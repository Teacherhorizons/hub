<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Teacher Horizons placement points" />
    <title>Placement points | Teacher Horizons Hub</title>
    <link rel="icon" href="/assets/hub-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/global/th-global.css" />
    <link rel="stylesheet" href="/styles.css?v=18" />
    <link rel="stylesheet" href="/advisers/placement-points/placement.css?v=1" />
    <script src="/app.js?v=10" defer></script>
  </head>
  <body class="hub-app placement-route">
    <a class="skip-link" href="#main-content">Skip to main content</a>
      <main id="main-content" class="placement-page-main min-h-screen w-full px-12 pt-4 bg-white">
        <section class="hub-placement placement-page" aria-labelledby="placement-title">
          <div class="hub-section-heading">
            <div>
              <p class="hub-eyebrow">Your progress</p>
              <h1 id="placement-title">Placement points <span id="target-title">your target</span></h1>
            </div>
            <span id="month-chip" class="hub-month-chip">From URL</span>
          </div>
          <div id="content" class="content" aria-live="polite">
            <div class="state-panel" role="status">
              <span class="loading-dot" aria-hidden="true"></span>
              <span>Reading your progress...</span>
            </div>
          </div>
        </section>
      </main>
  </body>
</html>
